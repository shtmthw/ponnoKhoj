# Weekly updates for Go modules (app and pinned dev tools), the SHA-pinned
# GitHub Actions and the Dockerfile base images. Each update arrives as a PR
# that must pass every CI gate. Image digests in deploy/versions.env are
# bumped by hand alongside the Dockerfile ARGs (they must match).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: gomod
    directory: /tools
    schedule: { interval: weekly }
    groups:
      tools:
        patterns: ["*"]
    commit-message: { prefix: "build(tools)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(docker)" }
