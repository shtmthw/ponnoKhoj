# ponnoKhoj CI: every gate on every PR and push; publish to Docker Hub only
# from main or a v* tag, and only after every gate passed (agentPlan.md §11).
#
# - Each gate job runs the same Makefile target a developer runs locally
#   (`make ci` = all of them), so local and CI results mean the same thing.
# - Gate jobs need no secrets (fork PRs get none) and never touch the live
#   network beyond fetching pinned dependencies: the e2e cluster runs the
#   offline `ci` overlay (demo shop, statistical estimates).
# - Every action is pinned by full commit SHA; Dependabot bumps them.
# - The buildx GitHub Actions cache (type=gha) is used only by
#   docker/build-push-action: it needs the runtime token that GitHub gives
#   to actions, not to plain `run:` steps (Makefile builds run uncached).
name: ci

on:
  pull_request:
  push:
    branches: [main, development]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; main and tag runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

defaults:
  run:
    # bash -eo pipefail: a failing command in a pipe fails the step.
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint

  generate-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make generate-check

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make test
      - name: Fuzz each target for 30s on top of its seed corpus
        run: make fuzz FUZZTIME=30s
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: bin/coverage/unit.out
          retention-days: 7

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Integration tests (testcontainers, PostGIS)
        run: mkdir -p bin && make test-integration 2>&1 | tee bin/integration.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: bin/coverage/integration.out
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-log
          path: bin/integration.log
          retention-days: 7

  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: bin/coverage
          merge-multiple: true
      - name: Committed thresholds (test/coverage-thresholds.json)
        run: make coverage

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make vuln

  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: kustomize build | kubeconform -strict (dev, ci, prod) and policy tests
        run: make manifests

  dockerfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make dockerfile-lint

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build, run `version`, size budget, Trivy (fixable HIGH/CRITICAL)
        run: make image-check IMAGE=ponnokhoj:ci
      - name: Build linux/amd64 and linux/arm64 (no push)
        run: make image-multiarch

  estimate-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Baseline backtest against committed MAPE / range-coverage thresholds
        run: make eval

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install kind (version pinned in deploy/versions.env)
        run: |
          set -euo pipefail
          source deploy/versions.env
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: kind cluster + CNPG + cert-manager + Envoy Gateway, deploy the offline ci overlay
        run: make kind-up KIND_OVERLAY=ci IMAGE=ponnokhoj:e2e
      - name: End-to-end tests
        run: make e2e
      - name: Collect cluster state
        if: failure()
        run: |
          mkdir -p bin/e2e
          kubectl --context kind-ponnokhoj get all,jobs,gateway,httproute,cluster.postgresql.cnpg.io -A -o wide > bin/e2e/get.txt 2>&1 || echo "kubectl get failed" >> bin/e2e/errors.txt
          kubectl --context kind-ponnokhoj describe pods,jobs,deployments -n ponnokhoj > bin/e2e/describe.txt 2>&1 || echo "kubectl describe failed" >> bin/e2e/errors.txt
          kubectl --context kind-ponnokhoj logs -n ponnokhoj -l app.kubernetes.io/name=ponnokhoj --all-containers --prefix --tail=-1 > bin/e2e/logs.txt 2>&1 || echo "kubectl logs failed" >> bin/e2e/errors.txt
          kubectl --context kind-ponnokhoj get events -A --sort-by=.lastTimestamp > bin/e2e/events.txt 2>&1 || echo "kubectl events failed" >> bin/e2e/errors.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cluster-state
          path: bin/e2e
          retention-days: 7

  # Push to Docker Hub: only from main or a v* tag, only after every gate.
  # Skipped until the owner sets the DOCKERHUB_USERNAME repository variable
  # and the DOCKERHUB_TOKEN secret (a Docker Hub personal access token with
  # read/write scope, never the account password).
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.DOCKERHUB_USERNAME != ''
    needs: [lint, generate-check, unit, integration, coverage, vuln, manifests, dockerfile, image, estimate-eval, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless signing with the GitHub OIDC token
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/ponnokhoj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build arguments from deploy/versions.env
        id: args
        run: |
          set -euo pipefail
          source deploy/versions.env
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-main"; fi
          commit="$(git rev-parse --short=12 HEAD)"
          {
            echo "commit=${commit}"
            echo "build-args<<EOF"
            echo "GO_IMAGE=${GO_IMAGE}"
            echo "RUNTIME_IMAGE=${RUNTIME_IMAGE}"
            echo "VERSION=${version}"
            echo "COMMIT=${commit}"
            echo "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          # `latest` comes only from semver tags (below), never from main.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the digest (keyless) and verify the signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
          cosign verify "${IMAGE_NAME}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" > /dev/null
          echo "signature verified"
      - name: Smoke test the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ steps.args.outputs.commit }}
        run: |
          set -euo pipefail
          out="$(docker run --rm "${IMAGE_NAME}@${DIGEST}" version)"
          echo "$out"
          grep -q "commit ${COMMIT}" <<<"$out"
      - name: Job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE_NAME}"
            echo
            echo "Digest: \`${DIGEST}\` (signed with cosign keyless, verified)"
            echo
            echo "Tags:"
            while read -r t; do [ -n "$t" ] && echo "- \`$t\`"; done <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
