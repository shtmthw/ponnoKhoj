# Secrets are never committed. In prod they are synced from the owner's
# secret manager by External Secrets Operator through a ClusterSecretStore
# named "ponnokhoj" (docs/adr/0009-secrets.md). Remote key names are
# placeholders to map onto the real store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ponnokhoj-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ponnokhoj
  target:
    name: ponnokhoj-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_SECRET
      remoteRef:
        key: ponnokhoj/app-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ponnokhoj-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ponnokhoj
  target:
    name: ponnokhoj-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: ponnokhoj/backup-access-key-id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: ponnokhoj/backup-secret-access-key
