# CPU-based autoscaling for the web tier. Requires metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ponnokhoj-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ponnokhoj-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
