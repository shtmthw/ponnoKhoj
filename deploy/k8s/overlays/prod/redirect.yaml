apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ponnokhoj-https-redirect
spec:
  parentRefs:
    - name: ponnokhoj
      sectionName: http
  hostnames: ["ponnokhoj.example.com"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
