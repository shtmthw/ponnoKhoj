# Continuous WAL archiving and nightly base backups to S3-compatible object
# storage through the CloudNativePG Barman Cloud plugin (the in-tree
# barmanObjectStore field is deprecated upstream). Restore: docs/runbook.md.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: ponnokhoj-backups
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://REPLACE_ME-ponnokhoj-backups/
    s3Credentials:
      accessKeyId:
        name: ponnokhoj-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: ponnokhoj-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ponnokhoj-db-nightly
spec:
  # Six fields (seconds first): every day at 02:00 UTC.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: ponnokhoj-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
