# maxUnavailable (not minAvailable) so node drains also work at 1 replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ponnokhoj-web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponnokhoj
      app.kubernetes.io/component: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ponnokhoj-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponnokhoj
      app.kubernetes.io/component: worker
