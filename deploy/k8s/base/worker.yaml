apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponnokhoj-worker
  labels:
    app.kubernetes.io/name: ponnokhoj
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ponnokhoj
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponnokhoj
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: ponnokhoj
      automountServiceAccountToken: false
      # Must exceed SHUTDOWN_TIMEOUT (20 s) plus River's hard-stop margin (5 s).
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ponnokhoj
              app.kubernetes.io/component: worker
      containers:
        - name: worker
          image: ponnokhoj
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: ponnokhoj-config
            - secretRef:
                name: ponnokhoj-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ponnokhoj-db-app
                  key: uri
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          # The worker serves health and metrics on its metrics port only.
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
