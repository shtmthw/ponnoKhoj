# Ingress through Gateway API (not the Ingress API). The manifests are
# implementation-neutral: they reference a GatewayClass named "ponnokhoj",
# which the cluster provides (deploy/kind/gatewayclass.yaml binds it to
# Envoy Gateway; see docs/adr/0005-gateway-api-envoy-gateway.md).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ponnokhoj
spec:
  gatewayClassName: ponnokhoj
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ponnokhoj-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ponnokhoj
spec:
  parentRefs:
    - name: ponnokhoj
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ponnokhoj-web
          port: 80
      timeouts:
        request: 30s
---
# TLS certificate for the HTTPS listener. The issuer is environment-specific
# (dev: self-signed Issuer; prod: an ACME ClusterIssuer).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ponnokhoj-tls
spec:
  secretName: ponnokhoj-tls
  issuerRef:
    name: ponnokhoj-issuer
    kind: Issuer
  dnsNames:
    - localhost
