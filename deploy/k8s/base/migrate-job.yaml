# Schema migrations, then reference data. tools/devctl (`devctl deploy`) renames
# this Job after the image tag (Job templates are immutable, so every
# release gets its own Job), applies it before the Deployments and waits for
# it to complete. The migrator holds a Postgres advisory lock, so two Jobs
# racing cannot both migrate.
apiVersion: batch/v1
kind: Job
metadata:
  name: ponnokhoj-migrate
  labels:
    app.kubernetes.io/name: ponnokhoj
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponnokhoj
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ponnokhoj
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ponnokhoj
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ponnokhoj-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      containers:
        # Areas and categories (idempotent). The dev overlay adds --demo.
        - name: seed
          image: ponnokhoj
          imagePullPolicy: IfNotPresent
          args: ["seed"]
          envFrom:
            - configMapRef:
                name: ponnokhoj-config
            - secretRef:
                name: ponnokhoj-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ponnokhoj-db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
